name: deterministic-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Check dependency environment
        run: python scripts/check_environment.py --requirements requirements-dev.txt
      - name: Prepare CI artifact directory
        run: mkdir -p output/ci
      - name: Build API image
        run: docker build --tag intelligent-customer-api:ci .
      - name: Secret scan
        run: python scripts/scan_secrets.py
      - name: Audit API runtime dependencies
        run: python -m pip_audit -r requirements-api.lock
      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose --profile observability config --quiet
      - name: Start integration data services
        run: docker compose up --wait -d postgres qdrant
      - name: Apply database migrations
        run: docker compose run --rm migrate
      - name: Wait for Qdrant HTTP readiness
        run: |
          for attempt in $(seq 1 30); do
            if python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:6333/readyz", timeout=2).read()'; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs --no-color --tail=200 qdrant || true
          exit 1
      - name: PostgreSQL and Qdrant integration tests
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://app:development-only-change-me@127.0.0.1:5432/intelligent_customer
          TEST_QDRANT_URL: http://127.0.0.1:6333
        run: |
          set +e
          python -m pytest -q tests/test_postgres_checkpoint_integration.py tests/test_qdrant_integration.py 2>&1 | tee output/ci/postgres-qdrant-integration.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then
            docker compose ps > output/ci/integration-services.log
            docker compose logs --no-color --tail=200 postgres qdrant >> output/ci/integration-services.log 2>&1 || true
          fi
          exit "${status}"
      - name: Format check
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy agent rag model evaluation utils scripts src/app app.py
      - name: Type check tests
        run: python -m mypy tests
      - name: Unit and integration tests
        run: coverage run -m pytest -q
      - name: Coverage gate
        run: coverage report
      - name: Validate evaluation dataset manifest
        run: python -m evaluation.dataset_manifest
      - name: Deterministic retrieval regression
        run: python scripts/run_deterministic_regression.py --output output/ci/deterministic-summary.json
      - name: Five-way retrieval ablation
        run: python scripts/run_retrieval_ablation.py --output output/ci/retrieval-ablation.json
      - name: Deterministic red-team regression
        run: python scripts/run_red_team_regression.py --output output/ci/red-team-summary.json
      - name: Fake API load smoke
        run: python scripts/run_load_smoke.py --requests 10 --concurrency 2 --output output/ci/load-smoke.json
      - name: Retrieval quality gate
        run: >-
          python -m evaluation.quality_gate
          --summary output/ci/deterministic-summary.json
          --config config/evaluation_quality_gate.yml
      - name: Full dependency audit (known upstream vulnerabilities block release)
        if: always()
        run: >-
          python -m pip_audit -r requirements.txt
          --format json --output output/ci/pip-audit.json
      - name: Upload deterministic report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deterministic-retrieval-report
          path: |
            output/ci/deterministic-summary.json
            output/ci/red-team-summary.json
            output/ci/load-smoke.json
            output/ci/retrieval-ablation.json
            output/ci/pip-audit.json
            output/ci/postgres-qdrant-integration.log
            output/ci/integration-services.log
          if-no-files-found: warn
      - name: Stop integration data services
        if: always()
        run: docker compose down --volumes
