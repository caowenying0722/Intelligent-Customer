name: deterministic-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency environment
        run: python scripts/check_environment.py --requirements requirements-dev.txt
      - name: Format check
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy agent rag model evaluation utils scripts tests app.py
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Deterministic retrieval regression
        run: python scripts/run_deterministic_regression.py --output output/ci/deterministic-summary.json
      - name: Retrieval quality gate
        run: >-
          python -m evaluation.quality_gate
          --summary output/ci/deterministic-summary.json
          --min recall@1=0.5
          --min recall@3=1.0
          --min mrr=1.0
      - name: Upload deterministic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-retrieval-report
          path: output/ci/deterministic-summary.json
          if-no-files-found: warn
