name: deterministic-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency environment
        run: python scripts/check_environment.py --requirements requirements-dev.txt
      - name: Prepare CI artifact directory
        run: mkdir -p output/ci
      - name: Secret scan
        run: python scripts/scan_secrets.py
      - name: Dependency audit (known vulnerabilities block release)
        run: >-
          python -m pip_audit -r requirements.txt
          --format json --output output/ci/pip-audit.json
      - name: Format check
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy agent rag model evaluation utils scripts tests app.py
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Validate evaluation dataset manifest
        run: python -m evaluation.dataset_manifest
      - name: Deterministic retrieval regression
        run: python scripts/run_deterministic_regression.py --output output/ci/deterministic-summary.json
      - name: Retrieval quality gate
        run: >-
          python -m evaluation.quality_gate
          --summary output/ci/deterministic-summary.json
          --config config/evaluation_quality_gate.yml
      - name: Upload deterministic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-retrieval-report
          path: |
            output/ci/deterministic-summary.json
            output/ci/pip-audit.json
          if-no-files-found: warn
