[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".local_deps", "chroma_db", "output"]

[tool.ruff.lint]
select = [
    "BLE001",
    "C401",
    "DTZ005",
    "E7",
    "E9",
    "F",
    "FURB129",
    "I",
    "PIE810",
    "PLR1711",
    "PLW1510",
    "RET501",
    "RUF007",
    "RUF010",
    "S110",
    "SIM103",
    "SIM113",
    "TRY201",
    "UP004",
    "UP035",
    "UP037",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
explicit_package_bases = true
check_untyped_defs = true
exclude = "(?x)(^|/)(\\.local_deps|chroma_db|output)/"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".local_deps", "chroma_db", "output"]

[tool.coverage.run]
branch = true
source = ["agent", "evaluation", "model", "rag", "scripts", "utils"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 41
