services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: intelligent-customer-api:local
    init: true
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      APPLICATION_ENV: ${APPLICATION_ENV:-development}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOWED_ORIGINS: '["http://localhost:8501"]'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
